services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-for-local-compose}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@host.docker.internal:5432/netra}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      - backend
    networks:
      - netra-network

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@host.docker.internal:5432/netra}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - ai-service
    networks:
      - netra-network

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      ENV: production
    networks:
      - netra-network

networks:
  netra-network:
    driver: bridge
